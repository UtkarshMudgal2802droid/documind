name: Backend CI 
on: 
  pull_request: 
    branches: [ main ] 
jobs: 
  test: 
    runs-on: ubuntu-latest 
    steps: 
    - uses: actions/checkout@v3 
    - name: Set up Python 
      uses: actions/setup-python@v4 
      with: 
        python-version: '3.10' 
    - name: Install dependencies 
      run: pip install -r fastapi-ai-worker/requirements.txt pytest httpx 
    - name: Run Tests 
      run: cd fastapi-ai-worker && pytest app/tests/ 
